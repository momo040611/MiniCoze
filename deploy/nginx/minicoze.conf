# ============================================================
# MiniCoze Nginx 配置
# 用法：
#   cp deploy/nginx/minicoze.conf /etc/nginx/conf.d/minicoze.conf
#   把 server_name 改成你的域名（没有域名就保持 _）
#   nginx -t && systemctl reload nginx
# ============================================================

server {
    listen 80;
    # 有域名就填域名；先 IP 访问就保持 _
    server_name _;

    # 前端构建产物（由 deploy/10-release.sh 拷到这里）
    root /var/www/minicoze-web;
    index index.html;

    # 上传大小限制：要大于后端 FILE_MAX_DOCUMENT_SIZE（默认 50MB）
    client_max_body_size 60m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # ---------- 前端：SPA 路由回退 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存，保证发版后立刻生效
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # ---------- 后端 API 反向代理 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";

        # SSE / 流式对话关键：关闭缓冲，否则回复会"攒一大段才吐出来"
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---------- Swagger 文档 ----------
    location /api-docs {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 隐藏 Nginx 版本号
    server_tokens off;
}
